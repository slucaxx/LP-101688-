<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Para a Laiss</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #ff758c 0%, #ff7eb3 50%, #ff6699 100%);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #fff;
            overflow: hidden;
        }

        .container {
            text-align: center;
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(15px);
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.37);
            border: 1px solid rgba(255, 255, 255, 0.18);
            max-width: 450px;
            width: 90%;
            animation: fadeIn 1.2s ease-in-out;
        }

        .heart {
            font-size: 70px;
            color: #ffffff;
            text-shadow: 0 0 15px rgba(255, 255, 255, 0.8);
            animation: beat 1.2s infinite alternate;
            margin-bottom: 15px;
        }

        h1 {
            font-size: 22px;
            margin-bottom: 25px;
            text-shadow: 1px 1px 4px rgba(0, 0, 0, 0.3);
            line-height: 1.4;
        }

        .btn {
            background: #ffffff;
            color: #ff3366;
            border: none;
            padding: 15px 35px;
            font-size: 20px;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease-in-out;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }

        .btn:hover {
            background: #ffe6eb;
            transform: scale(1.06);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.3);
        }

        #message {
            display: none;
            animation: fadeIn 1s ease-in-out;
        }

        /* Animações */
        @keyframes beat {
            0% { transform: scale(1); }
            100% { transform: scale(1.12); }
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div class="container" id="main-content">
        <div class="heart">❤️</div>
        <h1>LAISS, SÓ QUERO FALAR QUE ESPERO TODOS OS DIAS E CONTO AS HORAS PRA PODER TE VER</h1>
        <button class="btn" onclick="showMessage()">CLIQUE AQUI</button>
    </div>

    <div class="container" id="message">
        <div class="heart">💖</div>
        <h1>E LEMBRANDOO</h1>
        <p style="font-size: 18px; margin-top: 15px; text-shadow: 1px 1px 3px rgba(0,0,0,0.2);">EU SOU O PROTAGONISTA E VC A FIGURANTE KKKKK ❤️</p>
    </div>

    <script>
        function showMessage() {
            document.getElementById('main-content').style.display = 'none';
            document.getElementById('message').style.display = 'block';
        }
    </script>

</body>
</html>
